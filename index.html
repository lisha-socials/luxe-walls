/* ===== ROUTER ===== */
var app=$('#app'),timers=[],busy=false,ign=false,cleanup=null;
function route(){var h=location.hash.replace(/^#\/?/,'').split('/')[0];return V[h]?h:'home'}
function render(){
 timers.forEach(clearInterval);timers=[];if(cleanup){cleanup();cleanup=null}
 var r=route();document.body.className='page-'+r+(r==='home'?' home':'');
 app.innerHTML=V[r]()+(r==='elements'?'':footer());bind();hdr();
 if(r==='home')hero();if(r==='elements')elements();
 document.title=(r==='home'?'':r[0].toUpperCase()+r.slice(1)+' — ')+'LuxeWall Studio'}
function go(h,fromHash){if(busy)return;h=h||'#/';closeAll();if(!fromHash&&(h===location.hash||(h==='#/'&&!location.hash)))return;busy=true;var c=$('#cur2');c.className='cur2 on';
 setTimeout(function(){if(!fromHash){ign=true;location.hash=h}render();scrollTo(0,0);c.className='cur2 off';setTimeout(function(){c.className='cur2';busy=false},700)},REDUCE?0:680)}
addEventListener('hashchange',function(){if(ign){ign=false;return}busy=false;go(location.hash,true)});
document.addEventListener('click',function(e){var a=e.target.closest('a[data-nav]');if(a){e.preventDefault();go(a.getAttribute('href'))}});
/* reveal */
var io=new IntersectionObserver(function(es){es.forEach(function(x){if(x.isIntersecting){x.target.classList.add('in');io.unobserve(x.target)}})},{threshold:.12});
function bind(){$$('.rv,.cv,.stmt h2,.pgh h1').forEach(function(el){io.observe(el)});
 var f=$('#frm');if(f)f.onsubmit=function(e){e.preventDefault();var x=f.elements;window.open(wa('Hi LuxeWall, I’m '+x.n.value+' ('+x.p.value+(x.e.value?', '+x.e.value:'')+'). Project: '+x.t.value+'. '+x.m.value),'_blank')};
 var pv=$('#pv');$$('.idx a[data-pv]').forEach(function(a){a.addEventListener('mouseenter',function(){var c=CO[a.dataset.pv];pv.innerHTML=im(c.k,600,c.pos,null,true);pv.classList.add('on')});a.addEventListener('mouseleave',function(){pv.classList.remove('on')})});
 $$('.pgh').forEach(function(p){p.classList.add('in')})}
var mx=0,my=0,cx=0,cy=0;addEventListener('mousemove',function(e){mx=e.clientX;my=e.clientY},{passive:true});
(function loop(){cx+=(mx-cx)*.18;cy+=(my-cy)*.18;var p=$('#pv');p.style.left=cx+'px';p.style.top=cy+'px';requestAnimationFrame(loop)})();

/* ===== HERO: blur-bloom crossfade, tab list, progress line ===== */
function hero(){
 var sl=$$('.sl'),tabs=$$('.tab'),cur=0,n=sl.length,D=6500,start=Date.now(),lock=false,pg=$('#prog');
 function show(i){if(lock||i===cur)return;lock=true;var o=sl[cur],nw=sl[i];
  sl.forEach(function(s){s.classList.remove('out')});o.classList.remove('on');o.classList.add('out');nw.classList.add('on');
  tabs.forEach(function(t,j){t.classList.toggle('on',j===i)});cur=i;start=Date.now();
  setTimeout(function(){o.classList.remove('out');lock=false},REDUCE?0:1700)}
 tabs.forEach(function(t){t.onclick=function(){show(+t.dataset.i)}});
 var tx=0,h=$('#hero');h.addEventListener('touchstart',function(e){tx=e.touches[0].clientX},{passive:true});h.addEventListener('touchend',function(e){var d=e.changedTouches[0].clientX-tx;if(Math.abs(d)>50)show((cur+(d<0?1:n-1))%n)});
 var kk=function(e){if(e.key==='ArrowRight')show((cur+1)%n);if(e.key==='ArrowLeft')show((cur-1+n)%n)};document.addEventListener('keydown',kk);
 cleanup=function(){document.removeEventListener('keydown',kk)};
 timers.push(setInterval(function(){if(document.hidden||document.body.classList.contains('open-menu')||document.body.classList.contains('open-search'))start=Date.now();var p=Math.min(1,(Date.now()-start)/D);pg.style.transform='scaleX('+p+')';if(p>=1&&!REDUCE)show((cur+1)%n)},50));
 if(!$('#pre').classList.contains('gone'))return;heroIn()}
function heroIn(){var h=$('#hcopy');if(h)h.classList.add('in')}

/* ===== ELEMENTS: dots → grid appears → images bloom into cells ===== */
function elements(){
 var el=$('#el'),grid=$('#elgrid'),cols,cell,rows,cur=-1,tid,live=[];
 function size(){cols=innerWidth<700?6:12;cell=innerWidth/cols;rows=Math.ceil(innerHeight/cell);grid.style.backgroundSize=cell+'px '+cell+'px'}size();addEventListener('resize',size);
 function clear(){live.forEach(function(x){x.classList.remove('in');setTimeout(function(){x.remove()},900)});live=[]}
 function open(i){clearTimeout(tid);if(cur===i)return;clear();cur=i;el.classList.add('live');$$('.node').forEach(function(n,j){n.classList.toggle('act',j===i)});
  var e=EL[i],taken=[],sizes=[[3,2],[2,2],[2,3],[2,2],[3,2],[1,1],[2,1]],nx=e.x/100*cols,ny=e.y/100*rows,k=0;
  for(var t=0;t<260&&k<(cols<8?4:6);t++){var s=sizes[k%sizes.length],w=Math.min(s[0],cols-1),h=s[1],c0=Math.floor(Math.random()*(cols-w+1)),r0=Math.floor(Math.random()*(rows-h+1));
   if(nx>=c0-1&&nx<=c0+w+1&&ny>=r0-1&&ny<=r0+h+1)continue;
   if(r0*cell<150&&c0<4)continue;
   if(taken.some(function(q){return c0<q[0]+q[2]+0&&c0+w>q[0]&&r0<q[1]+q[3]&&r0+h>q[1]}))continue;
   taken.push([c0,r0,w,h]);var d=document.createElement('div');d.className='elimg';d.style.cssText='left:'+c0*cell+'px;top:'+r0*cell+'px;width:'+w*cell+'px;height:'+h*cell+'px;transition-delay:'+k*70+'ms';
   var key=e.im[k%e.im.length];d.innerHTML=im(key,700,(20+Math.random()*60|0)+'% '+(20+Math.random()*60|0)+'%',1+Math.random()*.5,true);el.insertBefore(d,el.firstChild.nextSibling);live.push(d);
   (function(d){requestAnimationFrame(function(){requestAnimationFrame(function(){d.classList.add('in')})})})(d);k++}}
 function close(){tid=setTimeout(function(){clear();cur=-1;el.classList.remove('live');$$('.node').forEach(function(n){n.classList.remove('act')})},350)}
 $$('.node').forEach(function(nd){var i=+nd.dataset.e;nd.addEventListener('mouseenter',function(){open(i)});nd.addEventListener('mouseleave',close);nd.addEventListener('click',function(){cur===i?(close()):open(i)})});
 var rs=size;cleanup=function(){removeEventListener('resize',rs)}}

/* ===== MENU / SEARCH ===== */
var NAVS=[['Work','#/'],['Collections','#/collections'],['Studio','#/studio'],['Process','#/process'],['Elements','#/elements'],['Contact','#/contact']];
$('#snav').innerHTML=NAVS.map(function(n){return'<a href="'+n[1]+'" data-nav>'+n[0]+'</a>'}).join('')+'<button id="sNav">Search</button>';
$('#sNav').onclick=function(){closeAll();setTimeout(function(){openSearch()},400)};
function hdr(){var r=route(),ov=document.body.classList.contains('open-search')||document.body.classList.contains('open-menu');var ink=document.body.classList.contains('open-search')||(r!=='home')||scrollY>innerHeight*.85;if(document.body.classList.contains('open-menu')&&r==='home')ink=false;if(document.body.classList.contains('open-menu'))ink=true;$('#hd').classList.toggle('ink',ink);document.body.classList.toggle('past',scrollY>innerHeight*.85)}
addEventListener('scroll',hdr,{passive:true});
function closeAll(){document.body.classList.remove('open-menu','open-search');document.body.style.overflow='';$('#bMenu').setAttribute('aria-expanded','false');hdr()}
function openMenu(){closeAll();document.body.classList.add('open-menu');$('#bMenu').setAttribute('aria-expanded','true');hdr()}
function openSearch(){closeAll();document.body.classList.add('open-search');document.body.style.overflow='hidden';hdr();setTimeout(function(){$('#q').focus()},500);doSearch()}
$('#bMenu').onclick=function(){document.body.classList.contains('open-menu')||document.body.classList.contains('open-search')?closeAll():openMenu()};
$('#bSearch').onclick=function(){document.body.classList.contains('open-search')?closeAll():openSearch()};
$('#shade').onclick=closeAll;
function doSearch(){var q=$('#q').value.trim().toLowerCase();var out=CO.filter(function(c){return!q||(c.n+' '+c.d).toLowerCase().indexOf(q)>-1});
 $('#res').innerHTML=out.length?out.map(function(c){return'<a href="#/collections" data-nav><div class="ph">'+im(c.k,500,c.pos,null,true)+'</div><p>'+c.n+'<small>Collection</small></p></a>'}).join(''):'<p class="sm">No results for “'+q+'”.</p>'}
$('#q').addEventListener('input',doSearch);
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeAll();if(e.key==='/'&&!/INPUT|TEXTAREA/.test(document.activeElement.tagName)){e.preventDefault();openSearch()}});

(function(){var c=0,el=$('#cnt'),pre=$('#pre');render();document.body.style.overflow='hidden';
 var iv=setInterval(function(){c+=Math.ceil(Math.random()*9)+3;if(c>=100){c=100;clearInterval(iv);setTimeout(function(){pre.classList.add('done');pre.classList.add('gone');document.body.style.overflow='';heroIn()},REDUCE?0:250)}el.textContent=String(c).padStart(3,'0')},REDUCE?1:50)})();
